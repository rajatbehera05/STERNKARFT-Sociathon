services:
  # ============================================================================
  # 1. PostgreSQL Database Service (Internal container network only)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sternx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sternkraft_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sternkraft_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sternx-network
    # Security constraint: Host port is NOT published, keeping PostgreSQL strictly private

  # ============================================================================
  # 2. Unified Backend Service (Express + Prisma 6)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sternx-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-sternkraft_db}?schema=public
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5173,http://127.0.0.1:80,http://localhost:5001}
      AUTO_DB_INIT: ${AUTO_DB_INIT:-true}
      AUTO_DB_SEED: ${AUTO_DB_SEED:-false}
    ports:
      # Kept available on host port 5001 for physical ESP32 / firmware HTTP telemetry ingestion
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sternx-network

  # ============================================================================
  # 3. Frontend Web Service (React 19 + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_FLOOD_API_BASE_URL: ${VITE_FLOOD_API_BASE_URL:-/api/flood}
        VITE_HEALTH_URL: ${VITE_HEALTH_URL:-/api/health}
    container_name: sternx-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sternx-network

volumes:
  postgres_data:
    name: sternx-postgres-data
    driver: local

networks:
  sternx-network:
    name: sternx-network
    driver: bridge
